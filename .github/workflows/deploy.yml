name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add .nojekyll to disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: automatic deployment from ${{ github.sha }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          enable_jekyll: false
          cname: veraz-pos.xyz

      - name: Verify Pages deployment
        run: |
          echo "Waiting 30 seconds for Pages to process..."
          sleep 30

          # Check if a Pages deployment was triggered in the last 2 minutes
          PAGES_RUN=$(gh run list --workflow="pages-build-deployment" --limit 1 --json createdAt,status --jq '.[0]')
          CREATED_AT=$(echo $PAGES_RUN | jq -r '.createdAt')
          STATUS=$(echo $PAGES_RUN | jq -r '.status')

          # Calculate time difference
          CREATED_TIMESTAMP=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          TIME_DIFF=$((CURRENT_TIMESTAMP - CREATED_TIMESTAMP))

          echo "Last Pages deployment: $CREATED_AT (${TIME_DIFF}s ago)"
          echo "Status: $STATUS"

          # If no recent deployment or stuck in queue, trigger manually
          if [ $TIME_DIFF -gt 120 ] || [ "$STATUS" = "queued" ]; then
            echo "⚠️  Pages deployment not triggered or stuck. Forcing redeploy..."

            # Fetch latest gh-pages
            git fetch origin gh-pages

            # Create empty commit to trigger Pages
            git checkout gh-pages
            git commit --allow-empty -m "chore: trigger Pages deployment (auto-recovery)"
            git push origin gh-pages

            echo "✅ Forced Pages deployment triggered"
          else
            echo "✅ Pages deployment is active"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
