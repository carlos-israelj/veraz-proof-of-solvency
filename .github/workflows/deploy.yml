name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add .nojekyll to disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: automatic deployment from ${{ github.sha }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          enable_jekyll: false
          cname: veraz-pos.xyz

      - name: Verify Pages deployment
        run: |
          echo "Waiting 30 seconds for Pages to process..."
          sleep 30

          # Check if a Pages deployment was triggered in the last 2 minutes
          PAGES_RUN=$(gh run list --workflow="pages-build-deployment" --limit 1 --json createdAt,status 2>&1)

          if echo "$PAGES_RUN" | grep -q "no runs found"; then
            echo "⚠️  No Pages deployments found. Forcing first deployment..."
            TRIGGER_DEPLOY=true
          else
            CREATED_AT=$(echo $PAGES_RUN | jq -r '.[0].createdAt')
            STATUS=$(echo $PAGES_RUN | jq -r '.[0].status')

            # Simple time check using Python (available in ubuntu-latest)
            TIME_DIFF=$(python3 -c "
          from datetime import datetime
          created = datetime.fromisoformat('${CREATED_AT}'.replace('Z', '+00:00'))
          now = datetime.now(created.tzinfo)
          print(int((now - created).total_seconds()))
          ")

            echo "Last Pages deployment: $CREATED_AT (${TIME_DIFF}s ago)"
            echo "Status: $STATUS"

            # If no recent deployment or stuck in queue, trigger manually
            if [ $TIME_DIFF -gt 120 ] || [ "$STATUS" = "queued" ]; then
              echo "⚠️  Pages deployment not triggered or stuck. Forcing redeploy..."
              TRIGGER_DEPLOY=true
            else
              echo "✅ Pages deployment is active"
              TRIGGER_DEPLOY=false
            fi
          fi

          # Trigger deployment if needed
          if [ "$TRIGGER_DEPLOY" = "true" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin gh-pages
            git checkout gh-pages
            git commit --allow-empty -m "chore: trigger Pages deployment (auto-recovery)"
            git push origin gh-pages
            echo "✅ Forced Pages deployment triggered"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
